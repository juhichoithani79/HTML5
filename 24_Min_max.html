<html>
    <head>
        <title>bus route</title>
    </head>
    <body>
        <form action="success.html" method="post">
            <table border="1" cellpadding="5" width="100%" bgcolor="CD5C5C">
                <tr>
                    <td>
                        <label for="source"><font color="white">Source</font></label>
                        <br>
                        <input type="text" name="source" id="source" required/>
                    </td>
                    <td>
                        <label for="destination"><font color="white">Destination</font></label>
                        <br>
                        <input type="text" name="destination" id="destination">
                    </td>
                     <td>
                        <label for="journeydate">Date</label>
                        <br>
                        <input type="date" min-date="2026-07-26" max="2026-10-30" name="journeydate" id="journeydate">
                    </td>
                    <td>
                        <label for="">Seats</label>
                        <br>
                        <input type="number" name="seats" min="1" max="6" required>
                    </td>
                    <td>
                        <label for="">Bus type</label>
                        <br>
                        <label for="express">
                            <input type="checkbox" name="express" id="express">Express
                        </label>
                        <br>
                        <label for="ac">
                            <input type="checkbox" name="ac" id="ac">AC
                        </label>
                        <br>
                        <label for="volvo">
                            <input type="checkbox" name="volvo" id="volvo">Volvo
                        </label>
                        <br>
                        <label for="sleeper">
                            <input type="checkbox" name="sleeper" id="sleeper">Sleeper
                        </label>
                    </td>
                    <td>
                        <label for="">Select gender</label>
                        <br>
                        <label for="male">
                            <input type="radio" name="male" id="male">Male
                        </label>
                        <br>
                        <label for="female"> 
                            <input type="radio" name="female" id="female">Female
                        </label>
                    </td>
                    <td>
                        <input type="submit" value="search">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
